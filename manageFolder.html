<!DOCTYPE html>
<html>
<head>
    <style>
        .doneBTN {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
        }
    </style>

    <title>Manage Folders</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body style="background: #111; color: white; font-family: Arial; padding: 30px;">
    <p>Add or remove your project folders.</p>
    <button id="addFolderBtn" style="padding:10px 20px; font-size:16px; background:#22c55e; color:black; border:none; border-radius:8px; cursor:pointer;">
        + Add Folder
    </button>

    <ul id="FolderList" class="folder-list"></ul>

    <div class="doneBTN">
        <button onclick="closeAndUpdate()" style="padding: 10px 20px; font-size: 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer;">
            Done
        </button>
    </div>

    <script>
        let bridge = null;
        let locations = [];

        new QWebChannel(qt.webChannelTransport, function(channel) 
        {
            bridge = channel.objects.bridge;

            bridge.getLocations(function(locationsJson)
            {
                locations = JSON.parse(locationsJson);
                RenderFolderList();
            })
        });
        
        document.getElementById('addFolderBtn').addEventListener('click', function() 
        {
            if (bridge) 
            {
                bridge.chooseFolder(function(selectedPath) 
                {
                    if (selectedPath && !locations.includes(selectedPath)) 
                    {
                        locations.push(selectedPath);
                        RenderFolderList();
                    } 
                });
            }
        });

        function RenderFolderList()
        {
            const list = document.getElementById('FolderList');
            list.innerHTML = '';

            locations.forEach((path, index) => {
                const li = document.createElement('li');
                li.className = 'folder-item';
                li.innerHTML = `
                    ${path}
                    <button onclick="removeFolder(${index})" style="background:red; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Remove</button>
                `;
                list.appendChild(li);
            })
        }

        function removeFolder(index) 
        {
            locations.splice(index, 1);
            RenderFolderList();
        }

        function closeAndUpdate() 
        {
            if (locations.length === 0) 
            {
                alert("Please add at least one folder.");
                return;
            }

            bridge.saveData(JSON.stringify(locations));
        }
    </script>
</body>
</html>
